<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Sensor placement on a bearing housing</title>
  <desc id="d">Diagram of a motor with a sensor on the drive-end bearing housing and arrows showing the horizontal, vertical, and axial measurement directions.</desc>
  <rect width="360" height="300" fill="#FFFFFF"/>
  <!-- shaft -->
  <rect x="20" y="146" width="320" height="10" fill="#8E9AA1"/>
  <!-- motor body -->
  <rect x="150" y="96" width="170" height="110" rx="8" fill="#4A5A62"/>
  <g stroke="#2E3A40" stroke-width="3">
    <line x1="175" y1="96" x2="175" y2="206"/><line x1="205" y1="96" x2="205" y2="206"/>
    <line x1="235" y1="96" x2="235" y2="206"/><line x1="265" y1="96" x2="265" y2="206"/>
    <line x1="295" y1="96" x2="295" y2="206"/>
  </g>
  <!-- bearing housing -->
  <rect x="110" y="116" width="40" height="70" rx="6" fill="#B8C1C6" stroke="#2E3A40" stroke-width="2"/>
  <!-- sensor -->
  <rect x="120" y="96" width="20" height="20" rx="3" fill="#F2A900" stroke="#2E3A40" stroke-width="2"/>
  <path d="M140 102 Q170 60 210 70" fill="none" stroke="#2E3A40" stroke-width="2"/>
  <!-- arrows -->
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2E3A40"/></marker></defs>
  <g stroke="#2E3A40" stroke-width="2.5" marker-end="url(#a)">
    <line x1="130" y1="92" x2="130" y2="40"/>
    <line x1="106" y1="151" x2="56" y2="151" transform="rotate(0)"/>
    <line x1="130" y1="190" x2="95" y2="240"/>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#2E3A40">
    <text x="138" y="40">Vertical</text>
    <text x="22" y="140">Axial</text>
    <text x="30" y="262">Horizontal</text>
  </g>
  <text x="180" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#4A5A62">Drive-end bearing housing</text>
</svg>
